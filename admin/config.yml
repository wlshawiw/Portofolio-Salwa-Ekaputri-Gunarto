backend:
  name: git-gateway
  branch: main

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: "portfolio"
    label: "Portofolio"
    files:
      - file: "index.html"
        label: "Halaman Utama"
        name: "home"
        fields:
          - { label: "Judul Utama", name: "title", widget: "string" }
          - { label: "Deskripsi Singkat", name: "description", widget: "text" }
          - { label: "Foto Profil / Banner", name: "image", widget: "image" }
