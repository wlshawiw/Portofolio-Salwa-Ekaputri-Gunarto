backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "portfolio"
    label: "Edit Portofolio"
    files:
      - file: "index.html"
        label: "Halaman Utama"
        name: "home"
        fields:
          - {label: "Nama Lengkap", name: "hero_title", widget: "string"}
          - {label: "Sub-judul / Profesi", name: "hero_subtitle", widget: "string"}
          - {label: "Deskripsi Profil", name: "hero_desc", widget: "text"}
